name: ci
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: lake build
        working-directory: lean
        run: lake build

      - name: crosscheck vs yaBMS
        run: |
          git clone --depth 1 https://github.com/koteitan/yaBMS "$RUNNER_TEMP/yaBMS"
          make -C "$RUNNER_TEMP/yaBMS/c"
          YABMS="$RUNNER_TEMP/yaBMS/c/bms" scripts/crosscheck.sh
