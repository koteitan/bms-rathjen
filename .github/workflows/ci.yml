name: ci
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: lake build
        working-directory: lean
        run: lake build

      - name: crosscheck vs yaBMS
        run: |
          git clone --depth 1 https://github.com/koteitan/yaBMS "$RUNNER_TEMP/yaBMS"
          make -C "$RUNNER_TEMP/yaBMS/c"
          YABMS="$RUNNER_TEMP/yaBMS/c/bms" scripts/crosscheck.sh

      - name: gentable up-to-date
        working-directory: lean
        run: |
          lake exe gentable > "$RUNNER_TEMP/r1-tm.md"
          diff -u ../table/r1-tm.md "$RUNNER_TEMP/r1-tm.md"

      # Every matrix in the table must be a STANDARD Bashicu matrix.  No Lean
      # check asks this — E1, the oR gate, bisim6, the sort orders and inT are
      # all satisfiable by a non-standard matrix — and one non-standard row did
      # get published (withdrawn at v0.1.82).  yaBMS is already built above.
      - name: standard form of every row
        run: scripts/standard-audit.sh "$RUNNER_TEMP/yaBMS/c"
